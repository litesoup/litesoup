services:
  litesoup:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu2404-systemd
    image: litesoup-test:ubuntu2404-systemd
    container_name: litesoup-test
    privileged: true
    # Note: `cgroup: host` requires Compose >=2.18; on Docker Compose v2.15
    # privileged: true already implies host cgroup namespace access.
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ../../:/litesoup:ro
    stop_signal: SIGRTMIN+3
    stop_grace_period: 5s
