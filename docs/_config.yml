# Jekyll config for litesoup docs (GitHub Pages).
# Theme: just-the-docs (sidebar nav, search, mobile-friendly).
# Set repo Settings → Pages → Source: GitHub Actions to deploy.

title: litesoup
description: WordPress hosting on your own VPS, sane defaults, no lock-in.
url: "https://docs.litesoup.com"
baseurl: ""

# just-the-docs via remote_theme (works on GitHub Pages without local Gemfile)
remote_theme: just-the-docs/just-the-docs
color_scheme: dark

# Site-wide nav settings
heading_anchors: true
search_enabled: true
search:
  heading_level: 3
  preview_words_before: 5
  preview_words_after: 10

# Repo links + edit-this-page links in the footer
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/codetot-web/litesoup"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# Footer text
footer_content: 'litesoup is open source. <a href="https://github.com/codetot-web/litesoup">Star us on GitHub</a>.'

# Build hygiene
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .gitignore
  - README.md  # README is the repo landing page; the Pages site uses index.md

# Plugins (allowed by GitHub Pages)
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Default front-matter for all .md (so subagent-written pages don't need to repeat layout)
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
