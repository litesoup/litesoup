name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          # -x: follow sourced files via `# shellcheck source=` annotations
          # -e SC1091: ignore "can't follow runtime-resolved sources" info; -x covers the real ones
          shellcheck -x -e SC1091 \
                     install/install-stack.sh \
                     install/lib/*.sh \
                     site/*.sh \
                     harden/*.sh \
                     audit/*.sh \
                     test/docker/run-integration.sh \
                     test/integration/*.sh

  bats-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Run bats unit tests
        run: ./test/bats/bats-core/bin/bats test/bats/

  # Single integration job: spins ONE systemd-enabled container and runs all
  # three integration scripts inside it in sequence. Previously this was three
  # `needs:`-chained jobs each spinning a fresh container -- which meant
  # install-stack.sh (apt install + PHP from CloudPanel mirror) ran 3x per CI.
  # Same total coverage; ~3x faster; one CloudPanel fetch per PR.
  # Failure granularity is preserved by run-integration.sh's per-script "===
  # SCRIPT ===" / "=== FAILED in SCRIPT ===" markers.
  integration:
    runs-on: ubuntu-24.04
    # GitHub Actions runners can't reach ppa.launchpadcontent.net reliably.
    # Skip the slow add-apt-repository attempt (60-120s wait) and go straight
    # to the CloudPanel mirror via install/lib/apt.sh's fast path. Saves ~1-2
    # min per CI run. install/lib/apt.sh recognizes this env var and bypasses
    # `add-apt-repository ppa:ondrej/php` entirely.
    env:
      LITESOUP_PPA_FORCE_MIRROR: cloudpanel
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Run all integration scripts in one container
        run: ./test/docker/run-integration.sh 01_install_stack.sh 02_site_create.sh 03_site_delete.sh
